<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kids Photography Ahmedabad | Tirth Modelling Studio</title>

  <meta name="description" content="Luxury kids photography in Ahmedabad...">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#050505;color:white;font-family:'Inter',sans-serif;}

    .container{width:90%;max-width:1400px;margin:auto;}

    .navbar{
      position:fixed;width:100%;top:0;left:0;
      background:rgba(0,0,0,0.55);backdrop-filter:blur(14px);
      z-index:1000;
    }

    .nav-wrapper{display:flex;justify-content:space-between;padding:18px 0;}

    .hero{height:75vh;position:relative;display:flex;align-items:center;}
    .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,0.85),rgba(0,0,0,0.3));}
    .hero-content{position:relative;z-index:2;}

    .gallery-section{padding:100px 0;}

    .gallery-filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
    .gallery-filters button{padding:10px 20px;border-radius:50px;background:#111;color:white;cursor:pointer;}
    .gallery-filters button.active{background:#d4ab72;color:black;}

    .gallery-grid{columns:3 300px;column-gap:20px;}

    .gallery-item{margin-bottom:20px;border-radius:20px;overflow:hidden;}

    img{width:100%;display:block;}

    #load-more-btn{
      padding:12px 28px;border-radius:50px;
      background:#d4ab72;border:none;cursor:pointer;
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="container nav-wrapper">
    <h1>TIRTH</h1>
    <a href="index.html">Back</a>
  </div>
</header>

<section class="hero">
  <img src="assets/kids/kids-cover.jpg">
  <div class="hero-overlay"></div>
</section>

<section class="gallery-section">

  <div class="container">

    <div class="gallery-filters">
      <button class="gender-btn active" onclick="filterGender('all', this)">All</button>
      <button class="gender-btn" onclick="filterGender('boys', this)">Boys</button>
      <button class="gender-btn" onclick="filterGender('girls', this)">Girls</button>
    </div>

    <div class="gallery-filters">
      <button class="location-btn active" onclick="filterLocation('all', this)">All</button>
      <button class="location-btn" onclick="filterLocation('outdoor', this)">Outdoor</button>
      <button class="location-btn" onclick="filterLocation('indoor', this)">Indoor</button>
    </div>

    <div class="gallery-grid" id="kids-gallery"></div>

    <div style="text-align:center;margin-top:40px;">
      <button id="load-more-btn" onclick="loadImages()">Load More</button>
    </div>

  </div>

</section>

<script>

const gallery = document.getElementById("kids-gallery");

const totalImages = 999;
const imagesPerLoad = 60;

let currentImage = 1;

let selectedGender = "all";
let selectedLocation = "all";

const boysAltTexts = [
  "Baby Boy Photography Ahmedabad",
  "Kids Birthday Photoshoot Ahmedabad",
  "1 Year Baby Boy Photoshoot Ahmedabad",
  "Toddler Boy Photography Ahmedabad"
];

const girlsAltTexts = [
  "Baby Girl Photography Ahmedabad",
  "Kids Theme Photoshoot Ahmedabad",
  "1 Year Baby Girl Photoshoot Ahmedabad",
  "Toddler Girl Photography Ahmedabad"
];

/* ✅ FIXED LOAD LOGIC */
function loadImages() {

  let loaded = 0;

  while (currentImage <= totalImages && loaded < imagesPerLoad) {

    let i = currentImage; // 🔥 FIX: no skipping logic anymore

    const location = (i <= 585) ? "outdoor" : "indoor";

    let gender =
      ((i >= 1 && i <= 307) || (i >= 586 && i <= 817))
      ? "boys"
      : "girls";

    const altText =
      gender === "boys"
        ? boysAltTexts[i % boysAltTexts.length]
        : girlsAltTexts[i % girlsAltTexts.length];

    gallery.innerHTML += `
      <div class="gallery-item ${gender} ${location}">
        <img src="assets/kids/kids-${i}.jpg" alt="${altText}" loading="lazy">
      </div>
    `;

    currentImage++;
    loaded++;
  }

  applyFilters();

  if (currentImage > totalImages) {
    document.getElementById("load-more-btn").style.display = "none";
  }
}

/* ✅ MUST EXIST BEFORE FIRST CALL */
function applyFilters() {

  document.querySelectorAll(".gallery-item").forEach(item => {

    const matchGender =
      selectedGender === "all" || item.classList.contains(selectedGender);

    const matchLocation =
      selectedLocation === "all" || item.classList.contains(selectedLocation);

    item.style.display = (matchGender && matchLocation) ? "block" : "none";

  });
}

function filterGender(type, btn) {
  selectedGender = type;

  document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  applyFilters();
}

function filterLocation(type, btn) {
  selectedLocation = type;

  document.querySelectorAll(".location-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  applyFilters();
}

/* INIT */
loadImages();

</script>

</body>
</html>
